<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parte 1 — Tela de Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="styles.css" rel="stylesheet">

  <script src="script.js" defer></script>
</head>
<body class="bg-light text-dark">

  <main id="telaLogin" class="min-vh-100 d-flex flex-column justify-content-center align-items-center py-4 px-3">
    <div class="card card-login shadow border-0 w-100" style="max-width: 440px;">
 
      <div class="card-header bg-primary text-white text-center py-4 rounded-top">
        <p class="small text-uppercase mb-1 text-white-50 fw-semibold">Parte 1 — Tela de Login</p>
        <h1 class="h4 mb-0 fw-bold">Login do Usuário</h1>
      </div>

      <div class="card-body p-4">
        
          <div id="mensagemLogin" class="alert d-none" role="alert" aria-live="polite"></div>

          <form id="formLogin" novalidate>
          
          <div class="mb-3">
            <label for="loginUsuario" class="form-label fw-semibold">Usuário</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input 
                type="text" 
                id="loginUsuario" 
                class="form-control" 
                placeholder="Digite seu usuário" 
                required 
                autocomplete="username"
              >
            </div>
          </div>

          <div class="mb-3">
            <label for="loginSenha" class="form-label fw-semibold">Senha</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input 
                type="password" 
                id="loginSenha" 
                class="form-control" 
                placeholder="Digite sua senha" 
                required 
                autocomplete="current-password"
              >
            <br>
              <button 
                class="btn btn-outline-secondary" 
                type="button" 
                id="btnToggleSenha" 
                aria-label="Alternar visibilidade da senha"
                title="Mostrar/ocultar senha"
              >
                <i class="bi bi-eye" id="iconeOlho"></i>
              </button>
            </div>
    
            <button id="botaoEntrar" class="btn btn-primary w-100 py-2 fw-semibold mt-2" type="submit">
            <span id="textoBotaoEntrar">Entrar</span>
            <span id="spinnerEntrar" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
          </button>

        </form>

          <div class="card-body p-3">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="small fw-bold text-secondary text-uppercase">
                <i class="bi bi-info-circle me-1"></i> Dados de Teste
              </span>
              <button id="btnPreencherTeste" type="button" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 0.75rem;">
                Preencher
              </button>
            </div>
            <p class="small mb-1 font-monospace"><strong>Usuário:</strong> Bret</p>
            <p class="small mb-0 font-monospace"><strong>Senha:</strong> Sincere@april.biz</p>
          </div>
        </div>

      </div>
    </div>
  </main>

    <div id="telaGaleria" class="d-none min-vh-100 d-flex flex-column">
    <header class="navbar navbar-expand navbar-dark bg-primary shadow-sm">
      <div class="container">
        <span class="navbar-brand d-flex align-items-center gap-2 mb-0 h1 fs-5">
          <i class="bi bi-images"></i>
          <span>Projeto Prático — Galeria</span>
        </span>

          <div class="d-flex align-items-center gap-3">
          <span class="text-white small d-none d-sm-inline">
            Usuário: <strong id="nomeUsuarioLogado">Bret</strong>
          </span>
     
          <button id="botaoSair" class="btn btn-outline-light btn-sm fw-semibold" type="button">
            <i class="bi bi-box-arrow-right me-1"></i> Sair
          </button>
        </div>
      </div>
    </header>

              <div class="bg-light p-3 rounded text-start mb-4">
                <h3 class="h6 fw-bold mb-2 text-primary">Dados do Usuário Autenticado:</h3>
                <ul class="list-unstyled mb-0 small">
                  <li><strong>Nome:</strong> <span id="infoNome">Carregando...</span></li>
                  <li><strong>Usuário (username):</strong> <span id="infoUsername">Carregando...</span></li>
                  <li><strong>Email (senha no teste):</strong> <span id="infoEmail">Carregando...</span></li>
                </ul>
              </div>
           </main>
    </div>

</body>
</html>
